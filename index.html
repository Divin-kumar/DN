<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #eef6ff, #dfe9ff);
        font-family: Arial, Helvetica, sans-serif;
        color: #1f2937;
      }

      .card {
        background: #ffffff;
        padding: 40px 50px;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(31, 41, 55, 0.12);
        text-align: center;
        max-width: 500px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 2.2rem;
      }

      p {
        margin: 0;
        font-size: 1.1rem;
        line-height: 1.6;
        color: #4b5563;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Welcome!</h1>
      <p>Thanks for visiting. We’re glad to have you here.</p>
    </div>
  </body>
</html>
